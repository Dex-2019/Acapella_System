<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#121212;
    --panel:#191919;
    --panel-2:#212121;
    --line:#2b2924;
    --yellow:#FDCE25;
    --yellow-dim:#DFB01A;
    --yellow-soft:rgba(253,206,37,.12);
    --text:#F2F0E9;
    --text-mute:#9C988D;
    --danger:#E5484D;
    --danger-bg:rgba(229,72,77,.12);
    --success:#3DD68C;
    --success-bg:rgba(61,214,140,.12);
    --warn:#F0A93C;
    --warn-bg:rgba(240,169,60,.12);
    --radius:10px;
    --font-display:'Space Grotesk', sans-serif;
    --font-body:'Inter', sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--ink);
    color:var(--text);
    font-family:var(--font-body);
    font-size:14px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--yellow); color:#121212; }
  a{ color:inherit; }
  button{ font-family:inherit; cursor:pointer; }
  input,select,textarea{ font-family:inherit; font-size:14px; }

  .eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-family:var(--font-display); font-weight:600;
    letter-spacing:.14em; text-transform:uppercase; font-size:11px;
    color:var(--text-mute);
  }
  .eyebrow::before{
    content:""; width:10px; height:10px; background:var(--yellow);
    clip-path:polygon(0 0, 100% 0, 100% 60%, 40% 60%, 15% 100%, 15% 60%, 0 60%);
    flex:0 0 auto;
  }
  h1,h2,h3{ font-family:var(--font-display); font-weight:600; letter-spacing:-.01em; }

  /* ---------- LOGIN ---------- */
  #login-screen{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(1200px 600px at 15% 0%, rgba(245,197,24,.08), transparent 60%),
      var(--ink);
    padding:24px;
  }
  .login-card{
    width:100%; max-width:380px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:16px;
    padding:36px 32px;
  }
  .login-logo{ display:flex; justify-content:center; margin-bottom:22px; }
  .login-logo img{ width:96px; height:96px; border-radius:20px; box-shadow:0 8px 24px rgba(253,206,37,.18); }
  .login-card h1{ font-size:20px; text-align:center; margin-bottom:4px; }
  .login-sub{ text-align:center; color:var(--text-mute); font-size:13px; margin-bottom:26px; }
  .field{ margin-bottom:16px; }
  .field label{
    display:block; font-size:11px; font-weight:600; letter-spacing:.06em;
    text-transform:uppercase; color:var(--text-mute); margin-bottom:6px;
  }
  .field input, .field select, .field textarea{
    width:100%; background:var(--panel-2); border:1px solid var(--line);
    color:var(--text); border-radius:8px; padding:11px 12px; outline:none;
    transition:border-color .15s;
  }
  .field textarea{ resize:vertical; min-height:70px; }
  .field input:focus, .field select:focus, .field textarea:focus{
    border-color:var(--yellow);
  }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    border:none; border-radius:8px; padding:11px 18px; font-weight:600; font-size:13.5px;
    transition:transform .1s, opacity .15s;
  }
  .btn:active{ transform:scale(.98); }
  .btn-primary{ background:var(--yellow); color:#121212; }
  .btn-primary:hover{ background:var(--yellow-dim); }
  .btn-block{ width:100%; }
  .btn-ghost{ background:transparent; color:var(--text-mute); border:1px solid var(--line); }
  .btn-ghost:hover{ color:var(--text); border-color:var(--text-mute); }
  .btn-danger{ background:var(--danger-bg); color:var(--danger); }
  .btn-danger:hover{ opacity:.8; }
  .btn:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, .navlink:focus-visible{
    outline:2px solid var(--yellow); outline-offset:2px;
  }
  .login-error{
    display:none; background:var(--danger-bg); color:var(--danger);
    border-radius:8px; padding:10px 12px; font-size:12.5px; margin-bottom:16px;
  }
  .login-config-warning{
    display:none; background:var(--warn-bg); color:var(--warn);
    border-radius:8px; padding:10px 12px; font-size:12px; margin-bottom:16px; line-height:1.5;
  }

  /* ---------- APP SHELL ---------- */
  #app-shell{ display:none; min-height:100vh; }
  .shell{ display:flex; min-height:100vh; }

  .sidebar{
    width:240px; flex:0 0 auto; background:var(--panel);
    border-right:1px solid var(--line);
    display:flex; flex-direction:column;
    position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .sidebar-brand{
    display:flex; align-items:center; gap:10px; padding:20px 18px 16px;
    border-bottom:1px solid var(--line);
  }
  .sidebar-brand img{ width:34px; height:34px; border-radius:8px; }
  .sidebar-brand span{ font-family:var(--font-display); font-weight:700; letter-spacing:.02em; font-size:15px; }
  .nav{ padding:14px 10px; display:flex; flex-direction:column; gap:2px; flex:1; }
  .navlink{
    display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:8px;
    color:var(--text-mute); text-decoration:none; font-weight:500; font-size:13.5px;
    background:none; border:none; width:100%; text-align:left;
  }
  .navlink .ic{ width:18px; text-align:center; font-size:15px; }
  .navlink:hover{ background:var(--panel-2); color:var(--text); }
  .navlink.active{ background:var(--yellow); color:#121212; font-weight:600; }
  .sidebar-footer{ padding:14px 10px; border-top:1px solid var(--line); }

  .main{ flex:1; min-width:0; }
  .topbar{
    position:sticky; top:0; z-index:5;
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 28px; border-bottom:1px solid var(--line);
    background:rgba(18,18,18,.85); backdrop-filter:blur(6px);
  }
  #mobile-menu-btn{ display:none; background:none; border:1px solid var(--line); color:var(--text); border-radius:8px; padding:8px 10px; }
  .topbar-title{ font-size:18px; }
  .topbar-sub{ color:var(--text-mute); font-size:12.5px; margin-top:2px; }
  .content{ padding:28px; max-width:1180px; }

  .grid{ display:grid; gap:16px; }
  .grid-4{ grid-template-columns:repeat(4,1fr); }
  .grid-3{ grid-template-columns:repeat(3,1fr); }
  .grid-2{ grid-template-columns:repeat(2,1fr); }
  @media (max-width: 980px){ .grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);} }

  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:20px;
  }
  .stat-card .stat-label{
    font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--text-mute);
  }
  .stat-card .stat-value{ font-family:var(--font-display); font-size:26px; font-weight:700; margin-top:8px; }
  .stat-card .stat-note{ font-size:12px; color:var(--text-mute); margin-top:6px; }

  .section-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:12px; flex-wrap:wrap; }
  .section-head h2{ font-size:17px; }

  .toolbar{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:16px; }
  .toolbar input[type=text], .toolbar input[type=search], .toolbar select{
    background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    border-radius:8px; padding:9px 12px; outline:none; font-size:13px;
  }
  .toolbar input:focus, .toolbar select:focus{ border-color:var(--yellow); }
  .filter-tabs{ display:flex; gap:6px; flex-wrap:wrap; }
  .filter-tab{
    background:var(--panel-2); border:1px solid var(--line); color:var(--text-mute);
    padding:7px 13px; border-radius:20px; font-size:12.5px; font-weight:500;
  }
  .filter-tab.active{ background:var(--yellow); color:#121212; border-color:var(--yellow); font-weight:600; }

  table{ width:100%; border-collapse:collapse; }
  thead th{
    text-align:left; font-size:11px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--text-mute); font-weight:600; padding:0 14px 10px; border-bottom:1px solid var(--line);
  }
  tbody td{ padding:13px 14px; border-bottom:1px solid var(--line); font-size:13.5px; vertical-align:middle; }
  tbody tr:hover{ background:var(--panel-2); }
  tbody tr:last-child td{ border-bottom:none; }
  .table-wrap{ overflow-x:auto; border:1px solid var(--line); border-radius:14px; background:var(--panel); }
  .table-wrap table{ min-width:640px; }
  .row-actions{ display:flex; gap:6px; }
  .icon-btn{
    background:var(--panel-2); border:1px solid var(--line); color:var(--text-mute);
    border-radius:7px; width:30px; height:30px; display:inline-flex; align-items:center; justify-content:center;
  }
  .icon-btn:hover{ color:var(--text); border-color:var(--text-mute); }

  .badge{
    display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:20px;
    font-size:11.5px; font-weight:600;
  }
  .badge-dot{ width:6px; height:6px; border-radius:50%; }

  .empty-state{
    text-align:center; padding:60px 20px; color:var(--text-mute);
  }
  .empty-state .ic{ font-size:30px; margin-bottom:10px; }
  .empty-state h3{ color:var(--text); font-size:15px; margin-bottom:6px; }
  .empty-state p{ font-size:13px; max-width:320px; margin:0 auto 18px; }

  /* Modal */
  .modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,.6);
    align-items:flex-start; justify-content:center; z-index:50; padding:40px 16px; overflow-y:auto;
  }
  .modal{
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    width:100%; max-width:520px; padding:26px;
  }
  .modal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
  .modal-head h3{ font-size:17px; }
  .modal-close{ background:none; border:none; color:var(--text-mute); font-size:20px; line-height:1; }
  .modal-close:hover{ color:var(--text); }
  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .form-grid .full{ grid-column:1 / -1; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:20px; }

  .import-help{ color:var(--text-mute); font-size:12.5px; line-height:1.6; margin-bottom:16px; }
  .import-help strong{ color:var(--text); }
  .import-or{
    text-align:center; color:var(--text-mute); font-size:11px; text-transform:uppercase;
    letter-spacing:.08em; margin:16px 0; position:relative;
  }
  #import-paste{
    width:100%; background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    border-radius:8px; padding:11px 12px; outline:none; font-family:'Inter',monospace; font-size:12.5px;
    resize:vertical;
  }
  #import-paste:focus{ border-color:var(--yellow); }
  .import-summary{
    display:flex; gap:10px; flex-wrap:wrap; margin:16px 0 4px;
  }
  .import-chip{
    font-size:12px; font-weight:600; padding:6px 12px; border-radius:20px;
  }
  .import-chip.ok{ background:var(--success-bg); color:var(--success); }
  .import-chip.warn{ background:var(--warn-bg); color:var(--warn); }
  .import-preview-table{ max-height:220px; overflow-y:auto; border:1px solid var(--line); border-radius:10px; margin-top:10px; }
  .import-preview-table table{ width:100%; border-collapse:collapse; }
  .import-preview-table th{
    position:sticky; top:0; background:var(--panel-2); text-align:left; font-size:10.5px;
    text-transform:uppercase; letter-spacing:.05em; color:var(--text-mute); padding:8px 10px; border-bottom:1px solid var(--line);
  }
  .import-preview-table td{ padding:8px 10px; font-size:12px; border-bottom:1px solid var(--line); max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .import-preview-table tr.row-warn td{ color:var(--warn); }

  .toast-wrap{ position:fixed; bottom:20px; right:20px; z-index:80; display:flex; flex-direction:column; gap:8px; }
  .toast{
    background:var(--panel-2); border:1px solid var(--line); border-left:3px solid var(--yellow);
    padding:12px 16px; border-radius:8px; font-size:13px; min-width:220px;
    box-shadow:0 8px 24px rgba(0,0,0,.35);
  }
  .toast.error{ border-left-color:var(--danger); }

  .loader{
    width:16px; height:16px; border-radius:50%; border:2px solid rgba(0,0,0,.25);
    border-top-color:#121212; animation:spin .7s linear infinite; display:inline-block;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .day-group{ margin-bottom:22px; }
  .day-group h4{
    font-family:var(--font-display); font-size:13px; color:var(--yellow);
    text-transform:uppercase; letter-spacing:.06em; margin-bottom:10px;
  }
  .week-group{ margin-bottom:26px; }
  .week-group h4{
    font-family:var(--font-display); font-size:13.5px; color:var(--yellow);
    text-transform:uppercase; letter-spacing:.05em; margin-bottom:12px;
    display:flex; align-items:center; gap:10px; padding-bottom:10px;
    border-bottom:1px solid var(--line);
  }
  .week-count{
    font-family:var(--font-body); text-transform:none; letter-spacing:0;
    background:var(--yellow-soft); color:var(--yellow); font-size:11px; font-weight:600;
    padding:3px 9px; border-radius:20px;
  }
  .content-item{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:var(--panel-2); border:1px solid var(--line); border-radius:10px;
    padding:12px 14px; margin-bottom:8px;
  }

  @media (max-width: 860px){
    .sidebar{ position:fixed; left:-260px; z-index:40; transition:left .2s; box-shadow:0 0 0 rgba(0,0,0,0); }
    .sidebar.open{ left:0; box-shadow:20px 0 40px rgba(0,0,0,.4); }
    #mobile-menu-btn{ display:inline-flex; }
    .form-grid{ grid-template-columns:1fr; }
    .content{ padding:18px; }
    .topbar{ padding:14px 18px; }
  }

  /* ================= VENTAS · COTIZACIONES · PERFIL ================= */
  .modal.wide{ max-width:980px; }
  #profile-overlay{ z-index:45; }
  #quote-overlay{ z-index:46; }

  .q-grid{ display:grid; grid-template-columns:2fr 1fr 1fr 1fr; gap:14px; }
  .q-client-card{
    display:grid; grid-template-columns:repeat(3,1fr); gap:10px 18px;
    background:var(--panel-2); border:1px solid var(--line); border-left:3px solid var(--yellow);
    border-radius:10px; padding:12px 14px;
  }
  .q-client-card .k, .p-row .k{ display:block; font-size:10px; text-transform:uppercase; letter-spacing:.07em; color:var(--text-mute); }
  .q-client-card .v, .p-row .v{ display:block; font-size:13px; font-weight:500; word-break:break-word; }
  .q-hint{ color:var(--warn); font-size:12px; margin-top:8px; }
  .q-add{ display:flex; gap:8px; flex-wrap:wrap; }
  .q-add select{
    background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    border-radius:8px; padding:8px 10px; font-size:12.5px; max-width:230px; outline:none;
  }
  .q-items{ min-width:760px; }
  .q-items thead th{ padding:10px 8px; }
  .q-items td{ padding:8px; }
  .q-in{
    width:100%; background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    border-radius:7px; padding:8px 9px; font-size:13px; outline:none;
  }
  .q-in:focus{ border-color:var(--yellow); }
  textarea.q-in{ resize:vertical; min-height:38px; }
  .q-amt{ text-align:right; white-space:nowrap; font-weight:600; }
  .q-bottom{ display:grid; grid-template-columns:1fr 300px; gap:18px; margin-top:16px; align-items:start; }
  .q-totals{ background:var(--panel-2); border:1px solid var(--line); border-radius:12px; padding:8px 16px; }
  .q-totals .row{ display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line); font-size:13px; }
  .q-totals .row span:first-child{ color:var(--text-mute); }
  .q-totals .row.total{ border:none; font-family:var(--font-display); font-size:18px; font-weight:700; color:var(--yellow); }
  .q-totals .row.total span:first-child{ color:var(--yellow); }

  .p-head{ display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:18px; }
  .p-id{ display:flex; align-items:center; gap:14px; min-width:0; }
  .p-avatar{
    width:52px; height:52px; border-radius:14px; background:var(--yellow); color:#121212;
    display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700; font-size:20px; flex:0 0 auto;
  }
  .p-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:16px; }
  .p-card{ background:var(--panel-2); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .p-card h4{ font-family:var(--font-display); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--yellow); margin-bottom:10px; }
  .p-row{ margin-bottom:9px; }
  .p-stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:18px; }
  .p-stats .card{ padding:14px 16px; }
  .p-stats .stat-value{ font-size:19px; }
  .p-sub{ font-family:var(--font-display); font-size:14px; margin:18px 0 10px; }
  .month-row{ cursor:pointer; }
  .month-row.sel td{ background:var(--yellow-soft); }
  .month-row.sel td:first-child{ color:var(--yellow); font-weight:600; }
  tr.sum-total td{ font-weight:700; border-top:1px solid var(--yellow); }
  @media (max-width: 860px){
    .q-grid, .q-bottom, .p-grid{ grid-template-columns:1fr; }
    .q-client-card{ grid-template-columns:1fr 1fr; }
    .p-stats{ grid-template-columns:1fr 1fr; }
  }

  /* ================= IMPRESIÓN DE COTIZACIÓN ================= */
  #print-root{ display:none; }
  .qp, .qp *{ -webkit-print-color-adjust:exact; print-color-adjust:exact; box-sizing:border-box; }
  .qp{ font-family:'Inter',Arial,sans-serif; color:#121212; font-size:11.5px; line-height:1.45; background:#fff; }
  .qp-head{
    background:#121212; color:#fff; padding:18px 22px; border-bottom:5px solid #FDCE25;
    display:flex; justify-content:space-between; align-items:center; gap:20px;
  }
  .qp-brand{ display:flex; align-items:center; gap:14px; }
  .qp-logo{ width:64px; height:64px; border-radius:12px; display:block; }
  .qp-brand-name{ font-family:'Space Grotesk',Arial,sans-serif; font-weight:700; font-size:20px; letter-spacing:.06em; color:#fff; }
  .qp-brand-name span{ color:#FDCE25; }
  .qp-brand-sub{ font-size:10.5px; color:#d6d1c4; margin-top:2px; }
  .qp-doc{ text-align:right; }
  .qp-doc-title{ font-family:'Space Grotesk',Arial,sans-serif; font-weight:700; font-size:24px; letter-spacing:.12em; color:#FDCE25; }
  .qp-doc-num{ font-size:14px; font-weight:700; margin-top:2px; color:#fff; }
  .qp-doc-meta{ font-size:10.5px; color:#d6d1c4; margin-top:4px; }
  .qp-title{
    font-family:'Space Grotesk',Arial,sans-serif; font-size:10.5px; font-weight:700; letter-spacing:.14em;
    text-transform:uppercase; margin:20px 0 8px; display:flex; align-items:center; gap:8px; color:#121212;
  }
  .qp-title::before{ content:""; width:18px; height:4px; background:#FDCE25; display:block; }
  .qp-client{
    border:1px solid #e3dfd2; border-left:5px solid #FDCE25; border-radius:4px; padding:12px 14px;
    display:grid; grid-template-columns:1fr 1fr; gap:8px 26px;
  }
  .qp-client .k{ font-size:8.5px; text-transform:uppercase; letter-spacing:.09em; color:#7a766b; }
  .qp-client .v{ font-weight:600; font-size:11.5px; word-break:break-word; }
  table.qp-table{ width:100%; border-collapse:collapse; margin-top:2px; }
  .qp-table thead th{
    background:#121212; color:#FDCE25; font-size:9px; text-transform:uppercase; letter-spacing:.08em;
    padding:8px 10px; text-align:left; border:none;
  }
  .qp-table tbody td{ padding:9px 10px; border-bottom:1px solid #e3dfd2; font-size:11.5px; vertical-align:top; }
  .qp-table tbody tr{ page-break-inside:avoid; }
  .qp-table tbody tr:hover{ background:transparent; }
  .qp-table .r{ text-align:right; white-space:nowrap; }
  .qp-table .c{ text-align:center; white-space:nowrap; }
  .qp-table .desc{ white-space:pre-line; }
  .qp-tag{ display:inline-block; font-size:9px; font-weight:700; padding:2px 7px; border-radius:20px; background:#FDCE25; color:#121212; }
  .qp-tag.ex{ background:#ece9de; color:#5f5b50; }
  .qp-totals{ margin-left:auto; width:290px; margin-top:12px; page-break-inside:avoid; }
  .qp-totals .row{ display:flex; justify-content:space-between; padding:6px 10px; border-bottom:1px solid #e3dfd2; font-size:11.5px; }
  .qp-totals .row.total{
    background:#121212; color:#FDCE25; font-family:'Space Grotesk',Arial,sans-serif; font-weight:700; font-size:14px;
    border:none; margin-top:4px; padding:9px 10px;
  }
  .qp-cond{ border:1px solid #e3dfd2; border-radius:4px; padding:10px 14px; white-space:pre-line; font-size:10.5px; color:#3b3830; page-break-inside:avoid; }
  .qp-sign{ display:flex; justify-content:space-between; gap:40px; margin-top:46px; page-break-inside:avoid; }
  .qp-sign div{ flex:1; border-top:1px solid #121212; padding-top:5px; text-align:center; font-size:9.5px; color:#5f5b50; }
  .qp-foot{
    margin-top:22px; border-top:3px solid #FDCE25; padding-top:8px; text-align:center;
    font-size:9.5px; color:#5f5b50; page-break-inside:avoid;
  }
  .qp-foot strong{ color:#121212; }

  @media print{
    @page{ size:letter; margin:10mm; }
    html, body{ height:auto !important; background:#fff !important; color:#121212 !important; }
    body > *:not(#print-root){ display:none !important; }
    #print-root{ display:block !important; }
  }
</style>
</head>

const fmtMoney = (n) => "L " + (Number(n)||0).toLocaleString("es-HN", {minimumFractionDigits:2, maximumFractionDigits:2});
const fmtDate = (d) => {
  if(!d) return "—";
  const dt = new Date(d + "T00:00:00");
  if (isNaN(dt)) return d;
  return dt.toLocaleDateString("es-HN", {day:"2-digit", month:"short", year:"numeric"});
};
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };

const SUCCESS_VALUES = ["Activo","Completada","Completado","Pagado","Aprobado","Publicado","Ganado","Aceptada"];
const WARN_VALUES = ["Pendiente","En proceso","En revisión","Producción","Diseño","Revisión","Programado","Contactado","Conversación","Propuesta","Negociación","Borrador","Enviada","En progreso"];
const DANGER_VALUES = ["Atrasada","Vencida","Inactivo","Perdido","Rechazada","Pausado"];
function badgeHtml(value){
  if(!value) return "";
  let cls = "neutral";
  if(SUCCESS_VALUES.includes(value)) cls = "success";
  else if(WARN_VALUES.includes(value)) cls = "warn";
  else if(DANGER_VALUES.includes(value)) cls = "danger";
  const colors = {
    success:{bg:"var(--success-bg)", c:"var(--success)"},
    warn:{bg:"var(--warn-bg)", c:"var(--warn)"},
    danger:{bg:"var(--danger-bg)", c:"var(--danger)"},
    neutral:{bg:"var(--panel-2)", c:"var(--text-mute)"}
  }[cls];
  return `<span class="badge" style="background:${colors.bg}; color:${colors.c};"><span class="badge-dot" style="background:${colors.c};"></span>${value}</span>`;
}
function priorityBadge(value){
  const map = {"Urgente":"🔴","Alta":"🟠","Media":"🟡","Baja":"🟢"};
  return `<span class="badge" style="background:var(--panel-2); color:var(--text);">${map[value]||""} ${value||""}</span>`;
}

function toast(msg, isError){
  const wrap = document.getElementById("toast-wrap");
  const el = document.createElement("div");
  el.className = "toast" + (isError ? " error" : "");
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=> el.remove(), 3800);
}

/* ========================= FIRESTORE LISTENERS ========================= */
function startListeners(){
  Object.values(SCHEMAS).forEach(schema => {
    const q = query(collection(db, schema.collection));
    state.listeners[schema.collection] = onSnapshot(q, (snap) => {
      const rows = [];
      snap.forEach(d => rows.push({id:d.id, ...d.data()}));
      // orden simple por el campo indicado (texto/fecha), nulos al final
      rows.sort((a,b) => {
        const av = a[schema.orderBy] || "";
        const bv = b[schema.orderBy] || "";
        return String(av).localeCompare(String(bv));
      });
      state.cache[schema.collection] = rows;
      if (state.view === schema.collection || ["dashboard","sales","expenses","quotes","clients"].includes(state.view) || state.profileId) {
        render();
      }
    }, (err) => {
      console.error(err);
      toast("No se pudo leer '" + schema.collection + "'. Revisa las reglas de Firestore.", true);
    });
  });
}
function stopListeners(){
  Object.values(state.listeners).forEach(unsub => unsub && unsub());
  state.listeners = {};
  state.cache = {};
}

function refLabel(refCollection, id){
  if(!id) return "—";
  const rows = state.cache[refCollection] || [];
  const row = rows.find(r => r.id === id);
  if(!row) return "—";
  return row.nombre || row.empresa || row.titulo || "—";
}

function renderCrudView(key){
  const schema = SCHEMAS[key];
  const rows = state.cache[schema.collection] || [];
  const search = (state.filters[key]?.q || "").toLowerCase();
  const filtered = search ? rows.filter(r => JSON.stringify(r).toLowerCase().includes(search)) : rows;

  viewRoot.innerHTML = `
    <div class="section-head">
      <h2>${schema.icon} ${schema.label}</h2>
      <button class="btn btn-primary" id="btn-add">+ Nuevo ${schema.singular.toLowerCase()}</button>
    </div>
    <div class="toolbar">
      <input type="search" placeholder="Buscar..." id="search-input" value="${search}" />
    </div>
    <div id="table-root"></div>
  `;
  document.getElementById("table-root").innerHTML = buildTable(key, filtered);
  document.getElementById("btn-add").addEventListener("click", ()=>openModal(key));
  document.getElementById("search-input").addEventListener("input", (e)=>{
    state.filters[key] = { q: e.target.value };
    renderCrudView(key);
  });
  bindTableRowEvents(key);
}

function buildTable(key, rows){
  const schema = SCHEMAS[key];
  if(!rows.length){
    return `<div class="table-wrap"><div class="empty-state"><div class="ic">${schema.icon}</div><h3>Aún no hay ${schema.label.toLowerCase()}</h3><p>Agrega el primer registro con el botón "+ Nuevo ${schema.singular.toLowerCase()}".</p></div></div>`;
  }
  const cols = schema.columns;
  return `
    <div class="table-wrap">
      <table>
        <thead><tr>${cols.map(c=>`<th>${fieldLabel(schema,c)}</th>`).join("")}<th></th></tr></thead>
        <tbody>
          ${rows.map(r => `
            <tr>
              ${cols.map(c => `<td>${renderCell(schema, c, r)}</td>`).join("")}
              <td>
                <div class="row-actions">
                  ${key==="clients" ? `<button class="icon-btn" data-profile="${r.id}" title="Ver perfil de empresa">👁</button>` : ""}
                  <button class="icon-btn" data-edit="${r.id}" title="Editar">✎</button>
                  <button class="icon-btn" data-del="${r.id}" title="Eliminar">🗑</button>
                </div>
              </td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    </div>
  `;
}
function fieldLabel(schema, key){
  if(key==="progreso") return "Progreso";
  const f = schema.fields.find(f=>f.key===key);
  return f ? f.label : key;
}
function renderCell(schema, key, row){
  if(key==="progreso") return `${row.progresoActual||0} / ${row.progresoObjetivo||0}`;
  const f = schema.fields.find(f=>f.key===key);
  const val = row[key];
  if(!f) return escapeHtml(val ?? "—");
  if(f.type==="select-ref") return escapeHtml(refLabel(f.ref, val));
  if(f.type==="date") return fmtDate(val);
  if(key==="monto" || key==="precioMensual" || key==="precio" || key==="total" || key==="subtotal" || key==="isv") return fmtMoney(val);
  if(key==="estado") return badgeHtml(val);
  if(key==="prioridad") return priorityBadge(val);
  return escapeHtml(val ?? "—") || "—";
}
function bindTableRowEvents(key, root){
  root = root || document;
  root.querySelectorAll("[data-profile]").forEach(b=>b.addEventListener("click",()=>openProfile(b.dataset.profile)));
  root.querySelectorAll("[data-edit]").forEach(b=>b.addEventListener("click",()=>openModal(key, b.dataset.edit)));
  root.querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click",()=>confirmDelete(key, b.dataset.del)));
}
function confirmDelete(key, id){
  const schema = SCHEMAS[key];
  if(!confirm(`¿Eliminar este ${schema.singular.toLowerCase()}? Esta acción no se puede deshacer.`)) return;
  deleteDoc(doc(db, schema.collection, id))
    .then(()=>toast(schema.singular + " eliminado."))
    .catch(()=>toast("No se pudo eliminar.", true));
}
function escapeHtml(str){
  return String(str ?? "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

  return `<div class="empty-state"><div class="ic">${icon}</div><h3>${title}</h3><p>${text}</p></div>`;
}

function openModal(key, editId, prefill){
  const schema = SCHEMAS[key];
  state.modal = { schemaKey: key, editId: editId || null };
  const row = editId ? (state.cache[schema.collection]||[]).find(r=>r.id===editId) : null;
  modalTitle.textContent = (editId ? "Editar " : "Nuevo ") + schema.singular.toLowerCase();

  modalGrid.innerHTML = schema.fields.map(f => {
    const value = row ? (row[f.key] ?? "") : ((prefill && prefill[f.key] !== undefined) ? prefill[f.key] : (f.default ?? ""));
    const fullClass = f.full ? "full" : "";
    if(f.type === "select"){
      return `<div class="field ${fullClass}"><label>${f.label}</label>
        <select name="${f.key}" ${f.required?"required":""}>
          <option value="">Selecciona…</option>
          ${f.options.map(o=>`<option value="${o}" ${value===o?"selected":""}>${o}</option>`).join("")}
        </select></div>`;
    }
    if(f.type === "select-ref"){
      const rows = state.cache[f.ref] || [];
      return `<div class="field ${fullClass}"><label>${f.label}</label>
        <select name="${f.key}">
          <option value="">Ninguno</option>
          ${rows.map(r=>`<option value="${r.id}" ${value===r.id?"selected":""}>${escapeHtml(r.nombre||r.empresa||r.titulo||"—")}</option>`).join("")}
        </select></div>`;
    }
    if(f.type === "textarea"){
      return `<div class="field ${fullClass}"><label>${f.label}</label><textarea name="${f.key}">${escapeHtml(value)}</textarea></div>`;
    }
    return `<div class="field ${fullClass}"><label>${f.label}</label>
      <input type="${f.type}" ${f.type==="number" ? 'step="any"' : ""} name="${f.key}" value="${escapeHtml(value)}" ${f.required?"required":""} />
    </div>`;
  }).join("");

  modalOverlay.style.display = "flex";
  if(key === "finance_income") bindSalesAutoTotal();
}

const MONTHS = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];

const pad2 = (n) => String(n).padStart(2, "0");
const round2 = (n) => Math.round((Number(n) || 0) * 100) / 100;
const clientById = (id) => (state.cache.clients || []).find(c => c.id === id);

function calcTotals(items){
  let gravado = 0, exento = 0;
  (items || []).forEach(it => {
    const line = round2((Number(it.cantidad) || 0) * (Number(it.precio) || 0));
    if (it.aplicaISV) gravado += line; else exento += line;
  });
  gravado = round2(gravado); exento = round2(exento);
  const isv = round2(gravado * ISV_RATE);
  return { gravado, exento, isv, total: round2(gravado + exento + isv) };
}
function nextQuoteNumber(){
  const nums = (state.cache.quotes || [])
    .map(q => parseInt(String(q.numero || "").replace(/\D/g, ""), 10))
    .filter(n => !isNaN(n));
  return "COT-" + String((nums.length ? Math.max(...nums) : 0) + 1).padStart(4, "0");
}
// Cotizaciones antiguas (sin detalle) se muestran como una sola línea con su total original.
function quoteItems(q){
  if (Array.isArray(q.items) && q.items.length) return q.items;
  const svc = refLabel("services", q.servicioId);
  return [{ descripcion: svc !== "—" ? svc : "Servicios de marketing", cantidad: 1, precio: Number(q.total) || 0, aplicaISV: false }];
}
function quoteTotals(q){
  if (Array.isArray(q.items) && q.items.length) return calcTotals(q.items);

}

async function qeSave(thenPrint){

  const items = qe.items
    .filter(i => (i.descripcion || "").trim() || Number(i.precio))
    .map(i => ({ descripcion: (i.descripcion || "").trim(), cantidad: Number(i.cantidad) || 0, precio: Number(i.precio) || 0, aplicaISV: !!i.aplicaISV }));
  if (!items.length) { toast("Agrega al menos un producto o servicio.", true); return; }

  const data = {
    numero: qe.numero, clienteId,
    fecha: byId("qe-fecha").value, vigencia: byId("qe-vigencia").value, estado: byId("qe-estado").value,
    items, subtotalGravado: t.gravado, subtotalExento: t.exento, isv: t.isv, total: t.total,
    condiciones: byId("qe-cond").value,
  };
  const btns = [byId("qe-save"), byId("qe-save-print")]; btns.forEach(b => b.disabled = true);
  try {
    let id = qe.id;
    if (id) { await updateDoc(doc(db, "quotes", id), data); }
    else { const ref = await addDoc(collection(db, "quotes"), { ...data, creadoEn: serverTimestamp() }); id = ref.id; }
    toast("Cotización " + data.numero + " guardada.");
    closeQuoteEditor();
    if (thenPrint) printQuote({ id, ...data });
  } catch (err) {
    console.error(err);
    toast("No se pudo guardar la cotización. Revisa la conexión o las reglas de Firestore.", true);
    btns.forEach(b => b.disabled = false);

/* ------------------------- VENTAS Y GASTOS: REGISTRO MENSUAL ------------------------- */
function monthlySummary(year){
  const inc = state.cache.finance_income || [], exp = state.cache.finance_expense || [];
  return MONTHS.map((m, i) => {
    const p = year + "-" + pad2(i + 1);
    const si = inc.filter(r => (r.fecha || "").startsWith(p)), se = exp.filter(r => (r.fecha || "").startsWith(p));
    const v = sumOf(si, r => r.monto), isv = sumOf(si, r => r.isv), g = sumOf(se, r => r.monto);
    return { p, m, v, isv, g, u: v - isv - g };
  });
}
const negColor = (n, ok) => n < 0 ? "var(--danger)" : (ok || "var(--text)");
function summaryTableHtml(summary, year, selected){
  const yv = sumOf(summary, r => r.v), yi = sumOf(summary, r => r.isv), yg = sumOf(summary, r => r.g), yu = yv - yi - yg;
  return `<div class="table-wrap"><table style="min-width:560px;">
    <thead><tr><th>Mes</th><th>Ventas</th><th>ISV</th><th>Gastos</th><th>Utilidad neta</th></tr></thead>
    <tbody>
      ${summary.map(r => `<tr class="month-row ${r.p === selected ? "sel" : ""}" data-month="${r.p}">
        <td>${r.m}</td><td>${fmtMoney(r.v)}</td><td>${fmtMoney(r.isv)}</td><td>${fmtMoney(r.g)}</td>
        <td style="color:${negColor(r.u)};">${fmtMoney(r.u)}</td></tr>`).join("")}
      <tr class="sum-total"><td>Total ${year}</td><td>${fmtMoney(yv)}</td><td>${fmtMoney(yi)}</td><td>${fmtMoney(yg)}</td>
        <td style="color:${negColor(yu, "var(--yellow)")};">${fmtMoney(yu)}</td></tr>
    </tbody></table></div>`;
}

function renderDashboard(){
  const today = todayISO(), year = today.slice(0, 4), mi = Number(today.slice(5, 7)) - 1;
  const tasks = state.cache.tasks || [];
  const tasksToday = tasks.filter(t => t.deadline === today && t.estado !== "Completada");

  const clientsActive = (state.cache.clients || []).filter(c => c.estado === "Activo");
  const projectsActive = (state.cache.projects || []).filter(p => p.estado === "Activo");
  const summary = monthlySummary(year), cur = summary[mi];
  const yu = sumOf(summary, r => r.u);
  const pending = sumOf((state.cache.finance_income || []).filter(r => r.estado === "Pendiente"), r => r.monto);
  const mrr = sumOf(clientsActive, c => c.precioMensual);
  const colored = (v, n) => `<span style="color:${negColor(n, "var(--text)")};">${v}</span>`;

  viewRoot.innerHTML = `

      ${statCard("Ventas del mes", fmtMoney(cur.v), "ISV incluido: " + fmtMoney(cur.isv))}
      ${statCard("Gastos del mes", fmtMoney(cur.g), monthLabel(year + "-" + pad2(mi + 1)))}
      ${statCard("Utilidad neta del mes", colored(fmtMoney(cur.u), cur.u), "ventas sin ISV − gastos")}
      ${statCard("Utilidad neta " + year, colored(fmtMoney(yu), yu), "acumulado del año")}
    </div>
    <div class="grid grid-4" style="margin-bottom:22px;">
      ${statCard("Tareas de hoy", tasksToday.length, tasksOverdue.length + " atrasadas")}
      ${statCard("Clientes activos", clientsActive.length, projectsActive.length + " proyectos activos")}
      ${statCard("Por cobrar", fmtMoney(pending), "ventas pendientes de pago")}
      ${statCard("MRR", fmtMoney(mrr), "mensualidades de clientes activos")}
    </div>
    <div class="card" style="margin-bottom:22px;">
      <div class="section-head"><h2>📆 Resumen mensual ${year}</h2></div>
      ${summaryTableHtml(summary, year, year + "-" + pad2(mi + 1))}
    </div>
    <div class="card">
      <div class="section-head"><h2>🔴 Tareas atrasadas y de hoy</h2></div>
      ${renderMiniTaskList([...tasksOverdue, ...tasksToday])}
    </div>`;
  viewRoot.querySelectorAll(".month-row").forEach(tr => tr.addEventListener("click", () => { state.filters.ledgerMonth = tr.dataset.month; navigateTo("sales"); }));
}

function renderLedger(kind){
  const isSales = kind === "sales";
  const key = isSales ? "finance_income" : "finance_expense";
  const all = state.cache[key] || [];
  const incAll = state.cache.finance_income || [], expAll = state.cache.finance_expense || [];
  const month = state.filters.ledgerMonth || "all";
  const isAll = month === "all";
  const years = [...new Set([...incAll, ...expAll].map(r => (r.fecha || "").slice(0, 4)).filter(y => /^\d{4}$/.test(y)).concat([todayISO().slice(0, 4)]))].sort();
  const year = isAll ? (state.filters.ledgerYear || todayISO().slice(0, 4)) : month.slice(0, 4);
  const inPeriod = (r) => isAll || (r.fecha || "").startsWith(month);
  const rows = all.filter(inPeriod).sort((a, b) => String(b.fecha || "").localeCompare(String(a.fecha || "")));
  const periodLabel = isAll ? "todo el registro" : monthLabel(month);
  const total = sumOf(rows, r => r.monto);
  const undated = all.filter(r => !r.fecha).length;
  const pSales = incAll.filter(inPeriod), pExp = expAll.filter(inPeriod);
  const netSales = sumOf(pSales, r => r.monto) - sumOf(pSales, r => r.isv);

  let stats;
  if (isSales) {
    stats = [
      statCard("Ventas", fmtMoney(total), `${rows.length} venta${rows.length === 1 ? "" : "s"} · ${periodLabel}`),
      statCard("ISV facturado", fmtMoney(sumOf(rows, r => r.isv)), "incluido en el total"),
      statCard("Cobrado", fmtMoney(sumOf(rows.filter(r => r.estado === "Pagado"), r => r.monto)), ""),
      statCard("Por cobrar", fmtMoney(sumOf(rows.filter(r => r.estado === "Pendiente"), r => r.monto)), ""),
    ];
  } else {
    const byCat = {};
    rows.forEach(r => { const k = (r.categoria || "Sin categoría").trim() || "Sin categoría"; byCat[k] = (byCat[k] || 0) + (Number(r.monto) || 0); });
    const top = Object.entries(byCat).sort((a, b) => b[1] - a[1])[0];
    const u = netSales - sumOf(pExp, r => r.monto);
    stats = [
      statCard("Gastos", fmtMoney(total), `${rows.length} registro${rows.length === 1 ? "" : "s"} · ${periodLabel}`),
      statCard("Ventas sin ISV", fmtMoney(netSales), periodLabel),
      statCard("Utilidad neta", `<span style="color:${negColor(u)};">${fmtMoney(u)}</span>`, "ventas sin ISV − gastos"),
      statCard("Mayor categoría", top ? escapeHtml(top[0]) : "—", top ? fmtMoney(top[1]) : ""),
    ];
  }
  const summary = monthlySummary(year);

  viewRoot.innerHTML = `
    <div class="section-head">
      <h2>${isSales ? "🧾 Registro de ventas" : "💸 Registro de gastos"}</h2>
      <button class="btn btn-primary" id="btn-ledger-add">+ ${isSales ? "Nueva venta" : "Nuevo gasto"}</button>
    </div>
    <div class="toolbar">
      <label style="color:var(--text-mute); font-size:12.5px;">Mes</label>
      <input type="month" id="ledger-month" value="${isAll ? "" : month}" />
      <button class="filter-tab ${isAll ? "active" : ""}" id="ledger-all">Ver todo</button>
      ${isAll ? `<label style="color:var(--text-mute); font-size:12.5px; margin-left:8px;">Año del resumen</label>
        <select id="ledger-year">${years.map(y => `<option ${y === year ? "selected" : ""}>${y}</option>`).join("")}</select>` : ""}
    </div>
    ${(!isAll && undated) ? `<div class="q-hint" style="margin:-6px 0 12px;">⚠ Hay ${undated} registro(s) sin fecha; solo aparecen en "Ver todo". Edítalos para asignarles fecha.</div>` : ""}
    <div class="grid grid-4" style="margin-bottom:20px;">${stats.join("")}</div>
    <div id="ledger-table-root" style="margin-bottom:28px;"></div>
    <div class="section-head"><h2 style="font-size:15px;">📆 Resumen mensual ${year}</h2></div>
    ${summaryTableHtml(summary, year, month)}`;

  const tableRoot = byId("ledger-table-root");
  tableRoot.innerHTML = buildTable(key, rows);
  bindTableRowEvents(key, tableRoot);
  byId("btn-ledger-add").addEventListener("click", () => openModal(key, null, { fecha: todayISO() }));
  byId("ledger-month").addEventListener("change", (e) => { state.filters.ledgerMonth = e.target.value || "all"; render(); });
  byId("ledger-all").addEventListener("click", () => { state.filters.ledgerMonth = isAll ? todayISO().slice(0, 7) : "all"; render(); });
  const ys = byId("ledger-year"); if (ys) ys.addEventListener("change", (e) => { state.filters.ledgerYear = e.target.value; render(); });
  viewRoot.querySelectorAll(".month-row").forEach(tr => tr.addEventListener("click", () => { state.filters.ledgerMonth = tr.dataset.month; render(); }));
}

/* ------------------------- PERFIL DE EMPRESA DEL CLIENTE ------------------------- */
const profileOverlay = byId("profile-overlay");
const profileModal = byId("profile-modal");
function openProfile(id){ state.profileId = id; renderProfile(); profileOverlay.style.display = "flex"; }
function closeProfile(){ state.profileId = null; profileOverlay.style.display = "none"; }
profileOverlay.addEventListener("click", (e) => { if (e.target === profileOverlay) closeProfile(); });

function renderProfile(){
  const c = clientById(state.profileId);
  if (!c) { closeProfile(); return; }
  const quotes = (state.cache.quotes || []).filter(q => q.clienteId === c.id).sort((a, b) => String(b.numero || "").localeCompare(String(a.numero || "")));
  const sales = (state.cache.finance_income || []).filter(s => s.clienteId === c.id).sort((a, b) => String(b.fecha || "").localeCompare(String(a.fecha || "")));
  const missing = [];
  if (!c.rtn) missing.push("RTN"); if (!c.razonSocial) missing.push("razón social"); if (!c.direccion) missing.push("dirección");
  const row = (k, v) => `<div class="p-row"><span class="k">${k}</span><span class="v">${v ? escapeHtml(v) : "—"}</span></div>`;
  const initials = clientName(c).split(/\s+/).slice(0, 2).map(w => w[0] || "").join("").toUpperCase();

  profileModal.innerHTML = `
    <div class="p-head">
      <div class="p-id">
        <div class="p-avatar">${escapeHtml(initials || "?")}</div>
        <div style="min-width:0;">
          <h3 style="font-size:20px;">${escapeHtml(clientName(c))}</h3>
          <div style="margin-top:4px;">${badgeHtml(c.estado)}</div>
        </div>
      </div>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button class="btn btn-primary" id="pf-quote">+ Nueva cotización</button>
        <button class="btn btn-ghost" id="pf-edit">✎ Editar cliente</button>
        <button class="btn btn-ghost" id="pf-close">Cerrar</button>
      </div>
    </div>
    ${missing.length ? `<div class="q-hint" style="margin:-6px 0 14px;">⚠ Perfil incompleto: falta ${missing.join(", ")}.</div>` : ""}
    <div class="p-stats">
      ${statCard("Cotizado", fmtMoney(sumOf(quotes, q => q.total)), quotes.length + " cotización(es)")}
      ${statCard("Vendido", fmtMoney(sumOf(sales, s => s.monto)), sales.length + " venta(s)")}
      ${statCard("Por cobrar", fmtMoney(sumOf(sales.filter(s => s.estado === "Pendiente"), s => s.monto)), "")}
      ${statCard("Mensualidad", fmtMoney(c.precioMensual), c.diaPago ? "pago el día " + c.diaPago : "")}
    </div>
    <div class="p-grid">
      <div class="p-card"><h4>Empresa</h4>
        ${row("Razón social", c.razonSocial)}${row("RTN", c.rtn)}${row("Giro / rubro", c.giro)}
        ${row("Dirección", [c.direccion, c.ciudad].filter(Boolean).join(", "))}
      </div>
      <div class="p-card"><h4>Contacto</h4>
        ${row("Nombre", c.nombre)}${row("Contacto", c.contacto)}${row("Teléfono", c.telefono)}${row("Correo", c.correo)}${row("Redes", c.redes)}
      </div>
      <div class="p-card"><h4>Servicio</h4>
        ${row("Plan contratado", c.plan)}${row("Cliente desde", c.fechaInicio ? fmtDate(c.fechaInicio) : "")}${row("Notas", c.notas)}
      </div>
    </div>
    <div class="p-sub">📑 Cotizaciones</div>
    ${quotes.length ? `<div class="table-wrap"><table>
      <thead><tr><th>No.</th><th>Fecha</th><th>Total</th><th>Estado</th><th></th></tr></thead>
      <tbody>${quotes.map(q => `<tr><td style="font-weight:600;">${escapeHtml(q.numero || "—")}</td><td>${fmtDate(q.fecha)}</td><td>${fmtMoney(q.total)}</td><td>${badgeHtml(q.estado)}</td>
        <td><div class="row-actions"><button class="icon-btn" data-q-print="${q.id}" title="Imprimir">🖨</button><button class="icon-btn" data-q-edit="${q.id}" title="Editar">✎</button></div></td></tr>`).join("")}</tbody></table></div>`
      : `<div class="table-wrap"><div class="empty-state" style="padding:26px;"><p style="margin:0;">Este cliente aún no tiene cotizaciones.</p></div></div>`}
    <div class="p-sub">🧾 Ventas</div>
    ${sales.length ? `<div class="table-wrap"><table>
      <thead><tr><th>Fecha</th><th>Concepto</th><th>Total</th><th>Estado</th></tr></thead>
      <tbody>${sales.map(s => `<tr><td>${fmtDate(s.fecha)}</td><td>${escapeHtml(s.concepto || "")}</td><td>${fmtMoney(s.monto)}</td><td>${badgeHtml(s.estado)}</td></tr>`).join("")}</tbody></table></div>`
      : `<div class="table-wrap"><div class="empty-state" style="padding:26px;"><p style="margin:0;">Sin ventas registradas.</p></div></div>`}
  `;
  byId("pf-close").addEventListener("click", closeProfile);
  byId("pf-edit").addEventListener("click", () => openModal("clients", c.id));
  byId("pf-quote").addEventListener("click", () => openQuoteEditor(null, c.id));
  bindQuoteRowActions(profileModal);
}


</script>
